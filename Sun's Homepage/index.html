<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sun's Homepage - Trang cá nhân">
  <title>Sun's Homepage</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-white text-black font-sm">


<nav class="fixed top-0 w-full left-0 bg-white z-50 h-24">
  <div class="flex flex-row items-center mx-90 h-full">

    <div class="flex items-center p-2 h-full md:w-[14.649%]">
      <img src="https://sun-asterisk.vn/wp-content/uploads/2020/10/logo-sun@2x.png" alt="Logo Sun Asterisk"
        class="h-8 " />
    </div>

    <div class="ml-auto md:w-[72.68%] h-full">
      <ul class="flex flex-row justify-end items-center h-full">
          <li class="nav-item active relative mr-8 h-full flex justify-center items-center cursor-pointer text-red-600">
             <span class="nav-indicator absolute top-2 left-1/2 h-1.5 w-6 -translate-x-1/2 rounded-full bg-red-600"></span>
              Home
          </li>
          <li class="nav-item relative mr-8 h-full flex justify-center items-center cursor-pointer">
             <span class="nav-indicator absolute top-2 left-1/2 h-1.5 w-6 -translate-x-1/2 rounded-full bg-red-600 hidden"></span>
            About Us
          </li>
          <li class="nav-item relative mr-8 h-full flex justify-center items-center cursor-pointer">
             <span class="nav-indicator absolute top-2 left-1/2 h-1.5 w-6 -translate-x-1/2 rounded-full bg-red-600 hidden"></span>
            Career
          </li>
          <li class="nav-item relative mr-8 h-full flex justify-center items-center cursor-pointer">
             <span class="nav-indicator absolute top-2 left-1/2 h-1.5 w-6 -translate-x-1/2 rounded-full bg-red-600 hidden"></span>
              Environment
          </li>
          <li class="nav-item relative mr-8 h-full flex justify-center items-center cursor-pointer">
             <span class="nav-indicator absolute top-2 left-1/2 h-1.5 w-6 -translate-x-1/2 rounded-full bg-red-600 hidden"></span>
            Projects
          </li>
          <li class="nav-item relative mr-8 h-full flex justify-center items-center cursor-pointer">
             <span class="nav-indicator absolute top-2 left-1/2 h-1.5 w-6 -translate-x-1/2 rounded-full bg-red-600 hidden"></span>
            News
          </li>
      </ul>
    </div>


    
    <div class=" md:w-[12.001%] flex justify-end items-center p-2 ">
     <ul class="flex flex-row">
       <li>
        <a class="lang-item text-gray-400 px-[6px] cursor-pointer  ">VI</a>
        
       </li>
       <li>
          
          <a class="lang-item active px-[13px] py-[1px] border rounded-sm border-red text-red-600 cursor-pointer">EN</a>
       </li>  
     </ul>

    </div>
  </div>

</nav>

<section>
  <video src="https://sun-asterisk.vn/wp-content/uploads/2020/11/mv-pc.mp4" autoplay muted loop></video>
</section>

<div class="min-h-screen">

</div>


<footer>
  <div>

  </div>
  <div class="h-12 bg-white">
    
  </div>
</footer>
<script src="main.js"></script>

</body>

</html>
